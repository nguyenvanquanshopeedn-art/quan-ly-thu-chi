name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_ROOT"
          CMDLINE_TOOLS=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name "sdkmanager" 2>/dev/null | head -n 1)
          yes | "$CMDLINE_TOOLS" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$CMDLINE_TOOLS" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Capacitor Android Project
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Quan Ly Thu Chi" "com.quanly.thuchi" --web-dir=www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyThuChi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
